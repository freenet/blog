name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -fsSL -o /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.154.5/hugo_extended_0.154.5_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb
      - name: Checks
        run: scripts/check.sh
      - name: Contract key unchanged
        # The blog's address is BLAKE3(BLAKE3(wasm) || parameters), base58.
        # It is derived here independently of fdev and compared against a value
        # written in this file, so moving the blog to a new address needs a
        # visible edit to this workflow, not just to files in the same diff.
        env:
          EXPECTED: CaK7kGohya2cLhoXQTLgBsrjDVLZKszD6ktexjRSaXCf
        run: |
          pip install --quiet blake3==1.0.5 base58==2.1.1
          derived=$(python3 -I -c 'import blake3, base58
          w = open("published-contract/website_contract.wasm", "rb").read()
          p = open("published-contract/website.parameters", "rb").read()
          print(base58.b58encode(blake3.blake3(blake3.blake3(w).digest() + p).digest()).decode())')
          echo "derived contract key: $derived"
          test "$derived" = "$EXPECTED"
          test "$(tr -d '[:space:]' < published-contract/contract-id.txt)" = "$EXPECTED"
          grep -qF "$EXPECTED" hugo.toml
          grep -qF "$EXPECTED" README.md
          hugo --minify --quiet --destination /tmp/site
          grep -qF "$EXPECTED" /tmp/site/index.xml
