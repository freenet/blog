{{ define "main" }}
<article>
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{ if .Date }}<p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>{{ with .Params.author }} · {{ . }}{{ end }}</p>{{ end }}
  </header>
  <div class="post-body">
  {{ .Content }}
  </div>
</article>
{{ end }}
